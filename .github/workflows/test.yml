name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -q

  # Installs the package the way the course autograder does, from the git URL.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv init --quiet demo && cd demo
          uv add "git+https://github.com/${{ github.repository }}.git@${{ github.sha }}"
          uv run streamlit-wake --version

  # Runs the action exactly as a user would, against a live public Streamlit app.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          file: does-not-exist.txt
          urls: https://ocean-soundscape-ml-paullai.streamlit.app/
