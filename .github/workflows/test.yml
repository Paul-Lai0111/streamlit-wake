name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv run pytest -q

  # Installs the package the way the course autograder does, from the git URL.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: false # nothing to cache: no checkout here
          ignore-empty-workdir: true
      - run: |
          uv init --quiet demo && cd demo
          uv add "git+https://github.com/${{ github.repository }}.git@${{ github.sha }}"
          uv run streamlit-wake --version

  # Runs the action exactly as a user would, against my own live Streamlit apps.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          file: does-not-exist.txt
          urls: |
            https://paul-mlb-deeppitch-analytics.streamlit.app/
            https://ocean-soundscape-ml-paullai.streamlit.app/
            https://semiconductor-yield-anomaly-detection-paullai.streamlit.app/
